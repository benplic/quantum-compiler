[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcompiler"
version = "0.1.0"
description = "A lightweight hardware-aware quantum circuit compiler"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
